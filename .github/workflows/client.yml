name: client

on:
  pull_request:
    paths:
      - client/**
      - contracts/deepmark-contract/tests/golden.txt
      - .github/workflows/client.yml
  push:
    branches: [main]
    paths:
      - client/**
      - contracts/deepmark-contract/tests/golden.txt
      - .github/workflows/client.yml

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: client
        run: bun run typecheck
      - name: Lint
        working-directory: client
        run: bun run lint
      - name: Format
        working-directory: client
        run: bun run format:check
      - name: Test
        working-directory: client
        run: bun run test:coverage
      - name: Build
        working-directory: client
        run: bun run build
      - name: Golden vectors are current
        working-directory: client
        run: |
          bun run golden 2>/dev/null > /tmp/golden.txt
          diff /tmp/golden.txt ../contracts/deepmark-contract/tests/golden.txt
      - name: Kit difficulty table is current
        working-directory: client
        run: |
          bun run kits 2>/dev/null > /tmp/kits.ts
          diff /tmp/kits.ts src/game/kitDifficulty.generated.ts
