name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: client
        run: bun run typecheck
      - name: Build
        working-directory: client
        run: bun run build

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-1.97.1-${{ hashFiles('contracts/deepmark-contract/Cargo.lock') }}
      - name: Test
        working-directory: contracts/deepmark-contract
        run: cargo test
      - name: Install Stellar CLI
        run: |
          set -euo pipefail
          curl -fsSL -o stellar.tar.gz https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  stellar.tar.gz" | sha256sum -c
          tar -xzf stellar.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build contract
        working-directory: contracts/deepmark-contract
        run: stellar contract build
