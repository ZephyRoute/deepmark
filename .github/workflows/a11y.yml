name: a11y

on:
  pull_request:
    paths:
      - client/**
      - docs/accessibility.md
      - .github/workflows/a11y.yml
  push:
    branches: [main]
    paths:
      - client/**
      - docs/accessibility.md
      - .github/workflows/a11y.yml

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Contrast ratios
        working-directory: client
        run: bun run contrast
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 154.0.8037.92
          install-dependencies: true
      - name: Build
        working-directory: client
        run: bun run build
      - name: Serve the production build
        working-directory: client
        run: |
          bun run preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://127.0.0.1:4173/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          echo "Preview server did not start" >&2
          exit 1
      - name: Axe, targets, reduced motion and keyboard
        working-directory: client
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run a11y http://127.0.0.1:4173/ --json > "$RUNNER_TEMP/a11y.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-report
          path: ${{ runner.temp }}/a11y.json
          if-no-files-found: ignore
