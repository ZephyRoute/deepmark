<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Deepmark is a turn-based dungeon crawler. Bank your relics or push deeper, and leave a verifiable mark on Stellar." />
  <meta name="theme-color" content="#07080e" />
  <title>Deepmark</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <p class="brand">Deepmark</p>
      <p id="floor-label" class="floor-label"></p>
      <button type="button" id="mute" class="btn btn-mini" data-action="mute" aria-pressed="false">Sound on</button>
    </header>
    <main class="stage-wrap">
      <div class="stage">
        <canvas id="game" width="832" height="576">Deepmark needs a canvas-capable browser.</canvas>
        <section id="overlay" class="overlay" hidden></section>
      </div>
    </main>
    <section id="hud" class="hud" hidden>
      <div class="hud-stats">
        <span id="hud-name"></span>
        <span id="hud-hp" class="hud-hp"><span class="hp-track"><span id="hp-ghost" class="hp-ghost"></span><span id="hp-fill" class="hp-fill"></span></span><span id="hp-text" class="hp-text"></span></span>
        <span id="hud-relics"></span>
        <span id="hud-score"></span>
        <span id="hud-mode"></span>
        <span class="hud-key"><span class="swatch swatch-open"></span>Open<span class="swatch swatch-block"></span>Blocked</span>
      </div>
      <p id="hud-log" class="hud-log"></p>
    </section>
    <nav class="touch" aria-label="Touch controls">
      <div class="pad">
        <button type="button" class="btn pad-btn pad-up" data-action="up" aria-label="Move up">↑</button>
        <button type="button" class="btn pad-btn pad-left" data-action="left" aria-label="Move left">←</button>
        <button type="button" class="btn pad-btn pad-down" data-action="down" aria-label="Move down">↓</button>
        <button type="button" class="btn pad-btn pad-right" data-action="right" aria-label="Move right">→</button>
      </div>
      <div class="touch-actions">
        <button type="button" class="btn btn-primary" data-action="confirm">Act</button>
        <button type="button" class="btn" data-action="cancel">Back</button>
      </div>
    </nav>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
