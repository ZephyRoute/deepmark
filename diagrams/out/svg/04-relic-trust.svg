 viewBox="0.00 0.00 1601.00 612.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="dm-04-relic-trust-title dm-04-relic-trust-desc"><title id="dm-04-relic-trust-title">Relic and delver minting and the trust model</title><desc id="dm-04-relic-trust-desc">Only a replay verified run can mint. finish_run mints through three Stellar Asset Contracts whose admin is the Deepmark contract, and the issuer account is locked. If a mint is rejected, for example because the player has no trustline, finish_run fails with MintFailed and reverts, so the run stays open and can be finished again. A full clear by a fresh delver also earns an owned delver record. The one remaining trust assumption is the contract admin who can upgrade the code until the role is renounced or moved to a multisig.</desc>
