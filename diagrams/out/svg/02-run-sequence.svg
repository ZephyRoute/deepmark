<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="966" viewBox="0 0 1460 966" role="img" aria-labelledby="dm-02-run-sequence-title dm-02-run-sequence-desc"><title id="dm-02-run-sequence-title">One run, two transactions</title><desc id="dm-02-run-sequence-desc">Sequence of one Deepmark run. start_run issues the seed on chain while the descent animation plays. The player then plays locally with no transactions. finish_run sends the action log, the contract replays it, updates the profile and leaderboard and mints relics. A rejected mint reverts the whole finish_run and leaves the run open.</desc>
<rect width="1460" height="966" fill="#0a0d1a"/>
<line x1="235" y1="70" x2="235" y2="952" stroke="#5b9bf0" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 6"/><rect x="100" y="14" width="270" height="50" rx="10" fill="#14233f" stroke="#5b9bf0" stroke-width="2"/><text x="235" y="40" font-family="Helvetica" font-size="16" font-weight="bold" fill="#cfe3ff" text-anchor="middle">Player</text><text x="235" y="60" font-family="Helvetica" font-size="12" font-weight="normal" fill="#9aa3bd" text-anchor="middle">in the browser</text>
<line x1="565" y1="70" x2="565" y2="952" stroke="#5b9bf0" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 6"/><rect x="430" y="14" width="270" height="50" rx="10" fill="#14233f" stroke="#5b9bf0" stroke-width="2"/><text x="565" y="40" font-family="Helvetica" font-size="16" font-weight="bold" fill="#cfe3ff" text-anchor="middle">Game client</text><text x="565" y="60" font-family="Helvetica" font-size="12" font-weight="normal" fill="#9aa3bd" text-anchor="middle">TypeScript, plays the run locally</text>
<line x1="895" y1="70" x2="895" y2="952" stroke="#e8b84a" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 6"/><rect x="760" y="14" width="270" height="50" rx="10" fill="#2b2110" stroke="#e8b84a" stroke-width="2"/><text x="895" y="40" font-family="Helvetica" font-size="16" font-weight="bold" fill="#ffe9ad" text-anchor="middle">Deepmark contract</text><text x="895" y="60" font-family="Helvetica" font-size="12" font-weight="normal" fill="#9aa3bd" text-anchor="middle">Soroban</text>
<line x1="1225" y1="70" x2="1225" y2="952" stroke="#a785ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 6"/><rect x="1090" y="14" width="270" height="50" rx="10" fill="#241a3d" stroke="#a785ee" stroke-width="2"/><text x="1225" y="40" font-family="Helvetica" font-size="16" font-weight="bold" fill="#e3d6ff" text-anchor="middle">Relic SACs</text><text x="1225" y="60" font-family="Helvetica" font-size="12" font-weight="normal" fill="#9aa3bd" text-anchor="middle">DMCOMMON, DMRARE, DMCORE</text>
<rect x="12" y="88" width="1436" height="26" rx="6" fill="#101528" stroke="#e8b84a" stroke-opacity="0.45"/>
<text x="26" y="106" font-family="Helvetica" font-size="14" font-weight="bold" fill="#e8b84a" text-anchor="start">Transaction 1: start_run (while the descent animation plays)</text>
<text x="400" y="138" font-family="Helvetica" font-size="13" font-weight="normal" fill="#eef0f8" text-anchor="middle">forge a delver, press descend</text>
<line x1="235" y1="152" x2="565" y2="152" stroke="#8c96b4" stroke-width="2"/>
<polygon points="565,152 555,147 555,157" fill="#8c96b4"/>
<text x="730" y="178" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">start_run(player, choice)</text>
<text x="730" y="196" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">player signs</text>
<line x1="565" y1="210" x2="895" y2="210" stroke="#e8b84a" stroke-width="2"/>
<polygon points="895,210 885,205 885,215" fill="#e8b84a"/>
<rect x="752" y="222" width="286" height="70" rx="8" fill="#2b2110" stroke="#e8b84a" stroke-width="1.6"/>
<text x="766" y="239" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">validate the delver</text>
<text x="766" y="257" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">derive the seed on chain</text>
<text x="766" y="275" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">store the open run</text>
<text x="730" y="310" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">RunTicket (seed, delver)</text>
<text x="730" y="328" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">event run_started</text>
<line x1="895" y1="342" x2="565" y2="342" stroke="#e8b84a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="565,342 575,337 575,347" fill="#e8b84a"/>
<rect x="12" y="366" width="1436" height="26" rx="6" fill="#101528" stroke="#e8b84a" stroke-opacity="0.45"/>
<text x="26" y="384" font-family="Helvetica" font-size="14" font-weight="bold" fill="#e8b84a" text-anchor="start">Play locally (no transaction, no waiting)</text>
<text x="400" y="416" font-family="Helvetica" font-size="13" font-weight="normal" fill="#eef0f8" text-anchor="middle">move, attack, retreat, descend, extract</text>
<line x1="235" y1="430" x2="565" y2="430" stroke="#8c96b4" stroke-width="2"/>
<polygon points="565,430 555,425 555,435" fill="#8c96b4"/>
<rect x="92" y="442" width="616" height="70" rx="8" fill="#14233f" stroke="#5b9bf0" stroke-width="1.6"/>
<text x="106" y="459" font-family="Helvetica" font-size="13" font-weight="normal" fill="#cfe3ff" text-anchor="start">simulation runs in the browser with the issued seed</text>
<text x="106" y="477" font-family="Helvetica" font-size="13" font-weight="normal" fill="#cfe3ff" text-anchor="start">one byte per action is appended to the action log</text>
<text x="106" y="495" font-family="Helvetica" font-size="13" font-weight="normal" fill="#cfe3ff" text-anchor="start">the result screen shows at once</text>
<rect x="12" y="528" width="1436" height="26" rx="6" fill="#101528" stroke="#e8b84a" stroke-opacity="0.45"/>
<text x="26" y="546" font-family="Helvetica" font-size="14" font-weight="bold" fill="#e8b84a" text-anchor="start">Transaction 2: finish_run (after the result screen is showing)</text>
<text x="730" y="578" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">finish_run(player, actions)</text>
<text x="730" y="596" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">player signs</text>
<line x1="565" y1="610" x2="895" y2="610" stroke="#e8b84a" stroke-width="2"/>
<polygon points="895,610 885,605 885,615" fill="#e8b84a"/>
<rect x="752" y="622" width="286" height="88" rx="8" fill="#2b2110" stroke="#e8b84a" stroke-width="1.6"/>
<text x="766" y="639" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">replay the log with the Rust port</text>
<text x="766" y="657" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">derive floor, score, relics, HP</text>
<text x="766" y="675" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">consume the open run</text>
<text x="766" y="693" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="start">update profile and leaderboard</text>
<text x="1060" y="728" font-family="Helvetica" font-size="13" font-weight="normal" fill="#e3d6ff" text-anchor="middle">mint(player, amount)</text>
<text x="1060" y="746" font-family="Helvetica" font-size="13" font-weight="normal" fill="#e3d6ff" text-anchor="middle">only after an extraction</text>
<text x="1060" y="764" font-family="Helvetica" font-size="13" font-weight="normal" fill="#e3d6ff" text-anchor="middle">rejected: MintFailed, run stays open</text>
<line x1="895" y1="778" x2="1225" y2="778" stroke="#a785ee" stroke-width="2"/>
<polygon points="1225,778 1215,773 1215,783" fill="#a785ee"/>
<text x="730" y="804" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">RunOutcome</text>
<text x="730" y="822" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">event run_finished</text>
<text x="730" y="840" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffe9ad" text-anchor="middle">hero_earned after a first full clear</text>
<line x1="895" y1="854" x2="565" y2="854" stroke="#e8b84a" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="565,854 575,849 575,859" fill="#e8b84a"/>
<rect x="92" y="866" width="616" height="52" rx="8" fill="#33200f" stroke="#f0913a" stroke-width="1.6"/>
<text x="106" y="883" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffdcb8" text-anchor="start">If Stellar is unreachable the game plays a labelled practice run.</text>
<text x="106" y="901" font-family="Helvetica" font-size="13" font-weight="normal" fill="#ffdcb8" text-anchor="start">A failed or slow finish_run never blocks play.</text>
</svg>